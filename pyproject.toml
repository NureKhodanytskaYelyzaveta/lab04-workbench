[project]
name = "lab04-workbench"
version = "1.0.0"
description = "Робоче місце гейм-дизайнера: інтерфейс до команди агентів (ЛР 3) і бази знань (ЛР 2)"
readme = "README.md"
authors = [
    { name = "NureKhodanytskaYelyzaveta", email = "yelyzaveta.khodanytska@nure.ua" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.0.0,<3.0.0",
    "chromadb>=1.5",
    "python-frontmatter>=1.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.45",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "playwright>=1.40",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = ["e2e: наскрізні тести Playwright (потребують браузера), запуск: pytest -m e2e"]
